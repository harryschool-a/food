<html lang="zh-Hant">
<head>

  <style>
    :root {
      --primary: #d9480f;
      --primary-hover: #b83204;
      --bg: #f8f9fa;
      --panel-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #e9ecef;
      --card-hover: #fff4e6;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 頂部導覽列 */
    header {
      background: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 26px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .stat-badge {
      background: #ffe8cc;
      color: #d9480f;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* 主要容器 */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      position: relative;
    }

    /* 側邊資訊欄 */
    .sidebar {
      width: 440px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      box-shadow: var(--shadow);
    }

    /* 篩選控制器 */
    .controls {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    select {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
    }

    /* 列表區域 */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fdfdfd;
    }

    .restaurant-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .restaurant-card:hover {
      border-color: #ffd8a8;
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(217, 72, 15, 0.08);
    }

    .restaurant-card.active {
      border-color: var(--primary);
      background: #fff9db;
      box-shadow: 0 0 0 2px var(--primary);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .card-district {
      font-size: 12px;
      background: #e9ecef;
      color: #495057;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge-category {
      background: #ffe3e3;
      color: #c92a2a;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .badge-price {
      background: #e6fcf5;
      color: #0ca678;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .card-desc {
      font-size: 13px;
      color: #495057;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .card-review {
      font-size: 12px;
      color: #862e9c;
      background: #f8f0fc;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid #ae3ec9;
      line-height: 1.4;
    }

    .card-address {
      font-size: 12px;
      color: #868e96;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 地圖區域 */
    #map {
      flex: 1;
      height: 100%;
      background: #e5e5e5;
    }

    /* Leaflet Popup 樣式自訂 */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 4px;
    }

    .popup-content {
      font-size: 13px;
      line-height: 1.5;
    }

    .popup-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .popup-badges {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .popup-desc {
      color: #333;
      margin-bottom: 6px;
    }

    .popup-review {
      background: #fdf2e9;
      border-left: 3px solid #e8590c;
      padding: 4px 8px;
      font-size: 12px;
      color: #d9480f;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .nav-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #fff !important;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: var(--primary-hover);
    }

    @media (max-width: 860px) {
      .app-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 50vh;
      }
      #map {
        height: 50vh;
      }
    }
  </style>

    // 初始化地圖（中心設定在高雄市中心）
    const map = L.map('map', {
      zoomControl: true
    }).setView([22.628, 120.295], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    // 地標圖標樣式生成
    function createCustomIcon(category) {
      return L.divIcon({
        className: 'custom-div-icon',
        html: `
          <div style="
            background-color: #d9480f;
            width: 28px;
            height: 28px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
          ">
            <span style="transform: rotate(45deg); font-size: 13px;">🍴</span>
          </div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
      });
    }

    let markers = [];
    let currentFiltered = [...rawRestaurants];

    // 建立下拉選單項目
    function setupFilters() {
      const districts = [...new Set(rawRestaurants.map(r => r.district))].sort();
      const categories = [...new Set(rawRestaurants.map(r => r.category))].sort();

      const districtSelect = document.getElementById('districtFilter');
      districts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });

      const categorySelect = document.getElementById('categoryFilter');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        categorySelect.appendChild(opt);
      });
    }

    // 渲染地圖標記與列表卡片
    function renderApp(data) {
      // 清空舊標記
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const listContainer = document.getElementById('restaurantList');
      listContainer.innerHTML = '';

      document.getElementById('statBadge').textContent = `顯示 ${data.length} / ${rawRestaurants.length} 間`;

      if (data.length === 0) {
        listContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 40px 10px;">
            <p style="font-size: 24px; margin-bottom: 8px;">🔍</p>
            <p>沒有符合條件的美食店家</p>
          </div>`;
        return;
      }

      const bounds = L.latLngBounds();

      data.forEach((item, index) => {
        // 加入標記到地圖
        const marker = L.marker([item.lat, item.lng], {
          icon: createCustomIcon(item.category)
        }).addTo(map);

        const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.name + ' ' + item.address)}`;
        
        const popupContent = `
          <div class="popup-content">
            <div class="popup-title">${item.name}</div>
            <div class="popup-badges">
              <span class="badge-category">${item.category}</span>
              <span class="badge-price">${item.price}</span>
            </div>
            <div class="popup-desc">${item.desc}</div>
            <div class="popup-review"><strong>💬 老饕短評：</strong>${item.review}</div>
            <div style="color: #666; font-size: 11px; margin-bottom: 8px;">📍 ${item.address}</div>
            <a href="${navUrl}" target="_blank" rel="noopener noreferrer" class="nav-btn">Google 導航路線 ↗</a>
          </div>
        `;

        marker.bindPopup(popupContent);
        markers.push(marker);
        bounds.extend([item.lat, item.lng]);

        // 建立左側列表卡片
        const card = document.createElement('div');
        card.className = 'restaurant-card';
        card.id = `card-${index}`;
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.name}</span>
            <span class="card-district">${item.district}</span>
          </div>
          <div class="card-meta">
            <span class="badge-category">${item.category}</span>
            <span class="badge-price">${item.price}</span>
          </div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-review">💬 ${item.review}</div>
          <div class="card-address">📍 ${item.address}</div>
        `;

        // 點擊卡片時地圖平移並打開 Popup
        card.addEventListener('click', () => {
          document.querySelectorAll('.restaurant-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          map.flyTo([item.lat, item.lng], 16, { animate: true, duration: 0.8 });
          marker.openPopup();
        });

        // 點擊標記時高亮對應卡片並平滑滾動
        marker.on('click', () => {
          document.querySelectorAll('.restaurant-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        listContainer.appendChild(card);
      });

      // 自動縮放視野以包含所有結果
      if (data.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
      }
    }

    // 篩選核心邏輯
    function applyFilter() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const district = document.getElementById('districtFilter').value;
      const category = document.getElementById('categoryFilter').value;

      currentFiltered = rawRestaurants.filter(item => {
        const matchesKeyword = !keyword || (
          item.name.toLowerCase().includes(keyword) ||
          item.address.toLowerCase().includes(keyword) ||
          item.desc.toLowerCase().includes(keyword) ||
          item.review.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword)
        );

        const matchesDistrict = !district || item.district === district;
        const matchesCategory = !category || item.category === category;

        return matchesKeyword && matchesDistrict && matchesCategory;
      });

      renderApp(currentFiltered);
    }

    // 事件監聽綁定
    document.getElementById('searchInput').addEventListener('input', applyFilter);
    document.getElementById('districtFilter').addEventListener('change', applyFilter);
    document.getElementById('categoryFilter').addEventListener('change', applyFilter);

    // 啟動應用
    setupFilters();
    renderApp(rawRestaurants);
  </script>
